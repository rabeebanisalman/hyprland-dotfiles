general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = sh -c 'if ! playerctl status | grep -q "Playing"; then systemctl suspend; fi'
}

listener {
    timeout = 3600
    on-timeout = sh -c 'if ! playerctl status | grep -q "Playing"; then systemctl poweroff; fi'
}
